services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: extracto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-extracto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-extracto}
      POSTGRES_DB: ${POSTGRES_DB:-extracto}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
